<!-- Screen Buddy's app icon: the robot head from src/mascot/Robot.tsx, simplified so it still reads
     at 16-32 px (bigger eyes, no glow underneath, no scanlines). Rendered to icon-source.png, from
     which `npx tauri icon` makes every size. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 -7 140 140" width="1024" height="1024">
  <defs>
    <radialGradient id="shell" cx="0.36" cy="0.22" r="0.95">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="0.45" stop-color="#eef1f6" />
      <stop offset="0.82" stop-color="#c4cbd7" />
      <stop offset="1" stop-color="#9aa6b8" />
    </radialGradient>
    <linearGradient id="under" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.6" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="1" stop-color="#2b8cff" stop-opacity="0.85" />
    </linearGradient>
    <linearGradient id="pod" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#465165" />
      <stop offset="1" stop-color="#0f141d" />
    </linearGradient>
    <radialGradient id="visor" cx="0.5" cy="0.28" r="0.85">
      <stop offset="0" stop-color="#18233a" />
      <stop offset="0.55" stop-color="#0d1322" />
      <stop offset="1" stop-color="#05070c" />
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Ear pods -->
  <rect x="13" y="40" width="18" height="48" rx="9" fill="url(#pod)" stroke="#0b1018" stroke-width="1.5" />
  <rect x="129" y="40" width="18" height="48" rx="9" fill="url(#pod)" stroke="#0b1018" stroke-width="1.5" />

  <!-- Shell -->
  <rect x="24" y="16" width="112" height="94" rx="46" ry="44" fill="url(#shell)" stroke="#5b6475" stroke-width="2" />
  <rect x="24" y="16" width="112" height="94" rx="46" ry="44" fill="url(#under)" />

  <!-- Visor -->
  <rect x="33.5" y="33.5" width="93" height="63" rx="26.5" fill="#1a2230" />
  <rect x="36" y="36" width="88" height="58" rx="24" fill="url(#visor)" />

  <!-- Eyes and smile -->
  <g fill="#3ee6ff" filter="url(#glow)">
    <ellipse cx="61" cy="60" rx="8" ry="10.5" />
    <ellipse cx="99" cy="60" rx="8" ry="10.5" />
    <path d="M71 76 Q80 84 89 76 Q80 80.5 71 76 Z" stroke="#3ee6ff" stroke-width="2.4" stroke-linejoin="round" />
  </g>

  <!-- Glass reflection -->
  <path d="M45 52 Q47 42 60 40" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="3" stroke-linecap="round" />
</svg>
