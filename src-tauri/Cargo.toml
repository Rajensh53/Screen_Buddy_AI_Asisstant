[package]
name = "screen-buddy"
version = "0.1.0"
description = "A small on-screen buddy that explains and translates selected text with a local model"
authors = ["Rajnesh Kumar Charan"]
license = "GPL-3.0-or-later"
repository = "https://github.com/Rajensh53/Screen_Buddy_AI_Asisstant"
edition = "2024"
publish = false

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name,
# see https://github.com/rust-lang/cargo/issues/8519
name = "screen_buddy_lib"
# Windows desktop only: `main.rs` links the `rlib`. The template's `staticlib` (iOS) and `cdylib`
# (Android) made an 841 MB .lib on every debug build without being used.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
# HTTP client for the local Ollama API only. No TLS: we only ever talk to http://127.0.0.1:11434.
reqwest = { version = "0.13", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Persisted settings (settings.json in the app data folder). Used from Rust only.
tauri-plugin-store = "2"
# A second launch opens Settings instead of a second app with a second mouse hook.
tauri-plugin-single-instance = "2"
# Log file in the app's log folder (release builds have no console). Never logs selected text.
tauri-plugin-log = "2"
log = "0.4"
# Same version Tauri uses internally, so it is compiled only once.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    # DwmFlush: the mascot's flight waits for each screen refresh, so it moves without stutter.
    "Win32_Graphics_Dwm",
    # GetUserNameExW: the first name from Windows, for the greeting when none is set.
    "Win32_Security_Authentication_Identity",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    # Clipboard fallback (when UI Automation can't read the selection): clipboard, its memory,
    # and the registry values that say whether clipboard history or cloud sync is on.
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Registry",
    # GetLocalTime: the local hour for the startup greeting.
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    # GetDoubleClickTime; for the clipboard fallback also GetAsyncKeyState and SendInput
    # (the copy keys). No keyboard hook is ever installed.
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
